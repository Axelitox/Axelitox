<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Humanizer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #212228;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #34353c;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 900px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
  }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .columns { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  textarea {
    flex: 1;
    min-height: 320px;
    resize: vertical;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.5;
    font-family: inherit;
    outline: none;
  }
  #output {
    white-space: pre-wrap;
    overflow-y: auto;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.2em; }
  .error { color: #dc2626; }
</style>
</head>
<body>
<main>
  <h1>Humanizer</h1>
  <p class="subtitle">Colle un texte généré par IA, obtiens une version qui sonne plus naturelle.</p>

  <div class="columns">
    <div class="panel">
      <h2>Texte d'origine</h2>
      <textarea id="input" placeholder="Colle ton texte ici..."></textarea>
    </div>
    <div class="panel">
      <h2>Résultat</h2>
      <div id="output" class="panel-content"></div>
    </div>
  </div>

  <div class="actions">
    <button id="submit">Humaniser</button>
    <span id="status" class="status"></span>
  </div>
</main>

<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");
  const button = document.getElementById("submit");
  const status = document.getElementById("status");

  button.addEventListener("click", async () => {
    const text = input.value.trim();
    if (!text) {
      status.textContent = "Colle d'abord un texte.";
      status.className = "status error";
      return;
    }

    button.disabled = true;
    status.textContent = "Génération en cours...";
    status.className = "status";
    output.textContent = "";

    try {
      const res = await fetch("/api/humanize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Erreur inconnue.");
      }

      output.textContent = data.result;
      status.textContent = "Terminé.";
    } catch (err) {
      status.textContent = err.message;
      status.className = "status error";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
